<!DOCTYPE html>
<!-- Source card for assets/og-american-power.jpg — render at 1200x630 and screenshot.
     Regenerate (from site root):
       chrome --headless --window-size=1200,630 --virtual-time-budget=6000 --screenshot=og.png tools/og-american-power.html
     then convert to JPG q88 -> assets/og-american-power.jpg -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{font-family:'Public Sans',sans-serif;background:#101E30;position:relative;color:#fff;}
  .photo{position:absolute;top:0;right:0;width:640px;height:630px;
    background:url("../assets/solar-home.jpg") center/cover no-repeat;}
  .photo:after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,#101E30 0%,rgba(16,30,48,.74) 32%,rgba(16,30,48,.22) 100%);}
  .glow{position:absolute;bottom:-260px;left:-140px;width:640px;height:640px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,163,61,.22),transparent 65%);}
  .topline{position:absolute;top:0;left:0;right:0;background:#050D1F;display:flex;align-items:center;justify-content:center;gap:12px;
    color:#D9CCA8;font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;padding:11px 0;z-index:3;}
  .topline img{height:22px;width:auto;}
  .in{position:absolute;left:64px;top:72px;z-index:2;width:720px;}
  .brand img{height:122px;width:auto;filter:drop-shadow(0 8px 22px rgba(0,4,34,.6));}
  h1{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;color:#fff;
    font-size:47px;line-height:1.06;margin-top:16px;text-shadow:0 6px 30px rgba(0,4,34,.55);}
  h1 .fl{color:#FFB25E;position:relative;white-space:nowrap;}
  h1 .fl svg{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:20px;overflow:visible;}
  h1 .fl svg path{stroke:#E8730C;stroke-width:9;fill:none;stroke-linecap:round;}
  .sub{margin-top:22px;font-size:22px;font-weight:700;color:#D9E2EC;}
  .sub b{color:#fff;}
  .phone{display:inline-flex;align-items:center;gap:12px;margin-top:20px;background:#E8730C;color:#fff;
    font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:28px;letter-spacing:.02em;
    padding:14px 32px;border-radius:999px;box-shadow:0 18px 44px -10px rgba(232,115,12,.55);}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="glow"></div>
  <div class="topline"><img src="../assets/div-power.png" alt=""> A division of American Appliance Repair, LLC · Corpus Christi, TX</div>
  <div class="in">
    <div class="brand"><img src="../assets/american-power-logo.png" alt=""></div>
    <h1>Stop renting your<br>electricity. Own<br>your <span class="fl">power.<svg viewBox="0 0 200 14" preserveAspectRatio="none"><path d="M4 10 C 60 2, 140 2, 196 8"/></svg></span></h1>
    <div class="sub">Solar · Battery backup · EV charging — <b>$0 down</b></div>
    <div class="phone">(361) 425-7797</div>
  </div>
</body>
</html>
